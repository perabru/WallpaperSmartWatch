name: Aplicar correcao de ajuste manual 2.2.0
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.upgrade/v2.2.0.xz', '.github/workflows/upgrade-v220.yml']
permissions:
  contents: write
  actions: write
concurrency:
  group: raccoon-upgrade-220
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Preservar ajustes manuais com integridade verificada
        run: |
          python3 - <<'PY'
          import hashlib,json,lzma
          from pathlib import Path
          raw=lzma.decompress(Path('.upgrade/v2.2.0.xz').read_bytes())
          assert hashlib.sha256(raw).hexdigest()=='49aa1ee3df7bd3476162aca38134c6b2a02a4430c2837edb2371f96e761c0792'
          changes=json.loads(raw)
          for name,c in changes.items():
              assert name=='app/src/main/assets/studio.js'
              p=Path(name); old=p.read_bytes()
              if hashlib.sha256(old).hexdigest()==c['sha256']: continue
              assert hashlib.sha256(old).hexdigest()==c['oldSha256'], 'Source changed concurrently'
              s=old.decode('utf-8')
              for a,b,text in reversed(c['edits']): s=s[:a]+text+s[b:]
              assert hashlib.sha256(s.encode()).hexdigest()==c['sha256']
              p.write_text(s)
          PY
      - name: Publicar fonte e executar testes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/studio.js
          if ! git diff --cached --quiet; then
            git commit -m 'fix: preserve manual edits when dimensions change'
            git push origin HEAD:main
          fi
          gh workflow run android.yml --repo "$GITHUB_REPOSITORY" --ref main
