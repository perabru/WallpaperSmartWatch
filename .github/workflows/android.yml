name: Android e interface
on:
  push:
    branches: [main]
    paths-ignore: ['release/**', 'docs/**', 'README.md', '.github/workflows/release-signed.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - name: Validar SDK Android instalado no runner
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
      - name: Dependencias fixadas e verificadas
        run: python3 tools/fetch-dependencies.py
      - name: Compilar APK e verificar politicas nativas
        run: |
          bash build.sh
          bash tools/test-policies.sh
      - name: Verificar geometria e codec GIF
        run: node tools/test-image-core.cjs
      - name: Preparar Chromium para testes
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Testar editor classico e Image Lab
        run: npm test
      - name: Gerar pacote do codigo-fonte
        if: always()
        run: git archive --format=zip HEAD > build/RaccoonStudio-source.zip
      - name: Publicar APK e relatorios de teste
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: RaccoonStudio-2.2.0-build
          path: |
            build/RaccoonStudio-debug.apk
            build/RaccoonStudio-source.zip
            build/native/aligned.apk
            build/native/build-verification.json
            build/native/signing-verification.txt
            build/qa/
            build/examples/
          if-no-files-found: error
          retention-days: 30
