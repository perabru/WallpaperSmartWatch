name: Conferir contraste Landscape 2.3
on:
  push:
    branches: [main]
    paths: ['.upgrade/v230.xz', '.github/workflows/upgrade-v230.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Aplicar correcao de contraste verificada
        run: |
          python3 - <<'PY'
          import hashlib,json,lzma
          from pathlib import Path
          raw=lzma.decompress(Path('.upgrade/v230.xz').read_bytes())
          assert hashlib.sha256(raw).hexdigest()=='c37d8f2e8446d7580c3973d89dad281759ae28adb9ff6826c49536ca0a77a47c'
          changes=json.loads(raw)
          assert set(changes)=={'app/src/main/assets/styles.css'}
          for name,item in changes.items():
              path=Path(name);old=path.read_bytes()
              if hashlib.sha256(old).hexdigest()==item['sha256']: continue
              assert hashlib.sha256(old).hexdigest()==item['oldSha256']
              text=old.decode()
              for start,end,value in reversed(item['edits']):
                  assert 0<=start<=end<=len(text)
                  text=text[:start]+value+text[end:]
              data=text.encode();assert hashlib.sha256(data).hexdigest()==item['sha256']
              path.write_bytes(data)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/styles.css
          if ! git diff --cached --quiet; then
            git commit -m 'fix: contraste claro em todas as superficies do editor classico'
            git push origin HEAD:main
          fi
      - name: Validar compilacao e interface
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android.yml --repo "$GITHUB_REPOSITORY" --ref main
