plugins { id 'com.android.application' }

android {
    namespace 'br.com.perabru.raccoonstudio'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'br.com.perabru.raccoonstudio'
        minSdk 26
        targetSdk 35
        versionCode 22
        versionName '2.2.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
        resources {
            excludes += ['META-INF/versions/**/module-info.class']
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])
}

// Fetch deliberately happens separately; builds verify the exact public artifacts
// locked in the repository. This check uses Java/Groovy and also works on Windows.
tasks.register('verifyPinnedDependencies') {
    doLast {
        def lock = new groovy.json.JsonSlurper().parse(rootProject.file('dependencies.lock.json'))
        def expected = lock.dependencies.collect { it.filename } as Set
        def actual = fileTree(dir: 'libs', include: ['*.aar', '*.jar']).files.collect { it.name } as Set
        if (actual != expected) {
            throw new GradleException('Run python3 tools/fetch-dependencies.py (or py tools/fetch-dependencies.py on Windows). app/libs must match dependencies.lock.json.')
        }
        lock.dependencies.each { entry ->
            def artifact = file('libs/' + entry.filename)
            def digest = java.security.MessageDigest.getInstance('SHA-256').digest(artifact.bytes).encodeHex().toString()
            if (artifact.length() != entry.bytes || digest != entry.sha256) {
                throw new GradleException('Dependency checksum mismatch: ' + entry.filename)
            }
        }
    }
}
tasks.named('preBuild').configure { dependsOn('verifyPinnedDependencies') }
